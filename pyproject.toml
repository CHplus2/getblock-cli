[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getblock-cli"
version = "0.1.0"
description = "Command-line interface for the GetBlock API"
requires-python = ">=3.10"
dependencies = [
    "typer==0.27.2",
    "httpx>=0.28.1,<0.29",
    "keyring>=25.7.0,<26",
    "rich>=15.0.0,<16",
]

[project.scripts]
getblock = "getblock.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["getblock*"]