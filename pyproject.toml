[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getblock-cli"
version = "0.1.0"
description = "Command-line interface for the GetBlock API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
]

[project.scripts]
getblock = "getblock.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["getblock*"]