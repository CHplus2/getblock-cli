name: Test and install
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m build --no-isolation
      - name: Install wheel and test outside the checkout
        shell: python
        run: |
          import glob, os, pathlib, shutil, subprocess, sys, tempfile
          wheel = str(pathlib.Path(glob.glob('dist/*.whl')[0]).resolve())
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', wheel], check=True)
          with tempfile.TemporaryDirectory() as directory:
              shutil.copytree('tests', pathlib.Path(directory) / 'tests')
              environment = dict(os.environ, GETBLOCK_CONFIG_DIR=str(pathlib.Path(directory) / 'config'))
              environment.pop('PYTHONPATH', None)
              subprocess.run([sys.executable, '-B', '-m', 'pytest', 'tests', '-q', '-p', 'no:cacheprovider'], cwd=directory, env=environment, check=True)
              subprocess.run(['getblock', '--version'], cwd=directory, env=environment, check=True)
              subprocess.run(['getblock', '--help'], cwd=directory, env=environment, check=True)
